version: "3.9"

services:
  honeypot:
    build:
      context: .
      dockerfile: Dockerfile.honeypot.main
    ports:
      - "2225:2225"
      - "8080:8080"   # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
      - ./data/geoip:/app/geoip
      - ./decoy:/app/decoy:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - ALERT_WEBHOOK=${ALERT_WEBHOOK}
      - ALERT_TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALERT_TELEGRAM_CHAT=${TELEGRAM_CHAT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: